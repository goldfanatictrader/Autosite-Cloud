name: autosite-cloud

# PostgreSQL backs API persistence when available. Redis and MinIO remain
# available for future phases but are not wired into the Phase 1 application.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autosite
      POSTGRES_PASSWORD: autosite
      POSTGRES_USER: autosite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosite -d autosite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass devpassword
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  postgres_data:
